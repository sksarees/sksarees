<style>
:root{--admin-ink:#241019;--admin-paper:#fffafb;--admin-card:#fff;--admin-accent:#8f1d3a}
body{background:linear-gradient(145deg,#fff7f5 0%,#f8f1ea 48%,#fff 100%);color:var(--admin-ink)}
.admin-wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}.admin-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px;margin:4px 0 16px;border-radius:22px;background:linear-gradient(125deg,#681127,#a8274b);color:#fff;box-shadow:0 12px 30px rgba(103,17,39,.18);flex-wrap:wrap}.admin-eyebrow{font-size:.66rem;letter-spacing:1.4px;font-weight:800;color:#f8d986}.admin-top h1{font:800 clamp(1.55rem,4vw,2.1rem)/1.1 var(--font-head,Georgia);margin:4px 0}.admin-sub{font-size:.82rem;opacity:.86;margin:0}.sync-pill{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;font-weight:800;padding:7px 12px;border-radius:999px;background:#fff;color:#6b4c05;border:0}.sync-pill.online{background:#e9f7ef;color:#187647}.admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0;scrollbar-width:none}.admin-tab{white-space:nowrap;flex:0 0 auto;min-height:42px;padding:0 15px;border-radius:12px;background:#fff;border:1px solid #eadde0;font-weight:800;font-size:.8rem;box-shadow:0 3px 10px rgba(68,25,37,.04)}.admin-tab.on{background:var(--admin-accent);border-color:var(--admin-accent);color:#fff;box-shadow:0 6px 15px rgba(143,29,58,.2)}#tabBody{min-height:320px}.filter-chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.filter-chips::-webkit-scrollbar,.admin-tabs::-webkit-scrollbar{display:none}.filter-chip{white-space:nowrap;padding:9px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:.78rem;flex:0 0 auto}.filter-chip.on{background:var(--maroon);border-color:var(--maroon);color:#fff}.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}.stat-chip{min-width:0;background:#fff;border:1px solid #eee0e3;border-radius:16px;padding:13px;text-align:left;box-shadow:0 4px 15px rgba(68,25,37,.04)}.stat-chip b{display:block;font-size:1.2rem;color:var(--maroon)}.stat-chip small{font-size:.65rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}.order-card,.tpl-card{border:1px solid #eee0e3;border-radius:18px;background:#fff;padding:15px;margin-bottom:12px;box-shadow:0 4px 16px rgba(68,25,37,.04)}.order-card .oc-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.order-card .oc-top b{font-size:.92rem}.order-card .oc-items{font-size:.8rem;color:var(--muted);margin:4px 0}.order-card select{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:.82rem;background:#fff;width:100%;margin-top:6px;font-weight:700}.oc-btns{display:grid;gap:8px;margin-top:10px}.oc-btns .btn{min-height:44px}.tpl-card h3{font-size:.95rem;margin-bottom:8px;font-family:var(--font-body)}.tpl-card p{font-size:.8rem;color:#7a6230;margin-bottom:10px}.product-toolbar{display:grid;grid-template-columns:1fr 190px;gap:9px;margin:0 0 12px}.product-toolbar input,.product-toolbar select{width:100%;border:1.5px solid #e7dce0;border-radius:12px;padding:11px 13px;background:#fff;outline:none;font:inherit}.product-toolbar input:focus,.product-toolbar select:focus{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(143,29,58,.09)}.prod-table-wrap{overflow-x:auto;background:#fff;border:1px solid #eee0e3;border-radius:18px;box-shadow:0 4px 16px rgba(68,25,37,.04)}.prod-table{width:100%;font-size:.8rem;border-collapse:collapse;min-width:560px}.prod-table th{text-align:left;padding:12px;font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--line);background:#fffafa}.prod-table td{padding:10px 11px;border-bottom:1px solid #f3e9eb}.prod-table tr:hover td{background:#fffafa}.prod-table tr:last-child td{border-bottom:none}.prod-table img{width:52px;height:52px;object-fit:cover;border-radius:10px}.low{color:var(--red);font-weight:800}@media(max-width:580px){.admin-wrap{padding:10px 10px 70px}.admin-top{padding:18px;border-radius:18px}.product-toolbar{grid-template-columns:1fr}.admin-tab{font-size:.75rem;padding:0 12px}}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SK Sarees">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Buy Sarees Online — Semi Silk, Cotton & Kanchipuram Sarees | SK Sarees Salem</title>
<meta name="description" content="Shop semi silk, soft silk, cotton, georgette & bridal sarees online from Salem. Free shipping ₹999+, COD, fast delivery to Tamil Nadu, Andhra, Karnataka. Aadi offers live!">
<meta name="keywords" content="buy sarees online, semi silk sarees, kanchipuram sarees salem, soft silk sarees, cotton sarees, wedding sarees, saree shop tamilnadu, saree cod, saree free shipping">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%238f1d3a'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%23e8c66a' font-family='Georgia'%3ESK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body data-page="shop">
<main id="app">

  <div class="wrap page">
    <h1>🛍️ Shop All Sarees</h1>
    <div style="display:flex;gap:8px">
      <input class="search-in" id="shopSearch" type="search" placeholder="🔍 Search sarees, fabric, colour…" autocomplete="off" style="flex:1;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;outline:none">
      <button id="voiceBtn" class="btn btn-ghost btn-sm" style="width:52px;min-height:50px;border:1.5px solid var(--line);font-size:1.1rem" aria-label="Voice search">🎙️</button>
    </div>
    <div class="cat-chips" id="catChips" style="margin-top:12px"></div>
    <div class="pd-block" style="margin-top:12px">
      <div style="display:grid;gap:10px;grid-template-columns:1fr;align-items:end">
        <div><label class="small muted" style="font-weight:800;display:block;margin-bottom:4px">Fabric</label>
          <select id="fFilter" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff"><option value="">All fabrics</option><option>Silk</option><option>Cotton</option><option>Georgette</option><option>Linen</option><option>Organza</option><option>Net</option></select></div>
        <div><label class="small muted" style="font-weight:800;display:block;margin-bottom:4px">Max Price — <span id="priceLbl">₹3,000</span></label>
          <input type="range" id="pFilter" min="299" max="3000" step="100" value="3000" style="width:100%;accent-color:var(--maroon)"></div>
        <div><label class="small muted" style="font-weight:800;display:block;margin-bottom:4px">Sort</label>
          <select id="sFilter" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff">
            <option value="newest">Newest</option><option value="bestselling">Best Selling</option>
            <option value="popular">Popularity</option><option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option><option value="discount">Biggest Discount</option>
          </select></div>
      </div>
    </div>
    <p class="small muted" id="countLbl" style="margin:12px 0 6px"></p>
    <div class="prow" id="grid"></div>
    <div class="grid-loader" id="gridLoader" style="display:none"><div class="spinner"></div>Loading more sarees…</div>
    <div id="sentinel" style="height:20px"></div>
    <div style="text-align:center;margin-top:6px"><button id="loadMoreBtn" class="btn btn-outline" style="width:auto;min-width:200px;display:none">Load More Sarees ↓</button></div>
    <div class="empty" id="empty" style="display:none"><div class="e-ic">🪡</div><b>No sarees found</b>Try clearing filters or search.</div>
  </div>
  
</main>
<script src="data.js"></script>
<script src="rec.js"></script>
<script src="app.js"></script>
</body>
</html>
